[package]
name = "store"
version = "0.5.7"
edition = "2021"
description = "OneClick — local-first shop management (single binary)"
license = "proprietary"
default-run = "store"

[[bin]]
name = "store"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/domain", "crates/storage", "crates/ui", "crates/app"]
# `crates/control` declares its own [workspace]: it is built separately and
# must never block `cargo run` for the till.
exclude = ["crates/control"]

[dependencies]
app = { path = "crates/app" }
storage = { path = "crates/storage" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

# Release profile: single small binary, no debug info.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

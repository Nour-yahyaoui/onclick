name: ci

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Blocking, and fast: catches the maud shorthand-class trap before the
      # compiler does (it broke the build twice, see issues #1 and #4).
      - name: maud class lint
        if: runner.os == 'Linux'
        run: python3 scripts/lint_maud.py

      # Blocking: the money maths must always hold, and the binary must build.
      - name: Unit tests (domain money/cart/VAT)
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release

      # Advisory for now: style debt should not block a first build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Doctor smoke test
        run: cargo run -- --doctor

  control-plane:
    name: control-plane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/control -> target"
      # Separate workspace: checked but never blocks the till build.
      - name: Build control plane
        run: cargo build
        working-directory: crates/control

name: ci

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Blocking: the money maths must always hold, and the binary must build.
      - name: Unit tests (domain money/cart/VAT)
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release

      # Advisory for now: style debt should not block a first build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Doctor smoke test
        run: cargo run -- --doctor

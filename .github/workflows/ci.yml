name: ci

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Blocking, and fast: catches the maud shorthand-class trap before the
      # compiler does (it broke the build twice, see issues #1 and #4).
      - name: maud class lint
        if: runner.os == 'Linux'
        run: python3 scripts/lint_maud.py

      # Blocking: the money maths must always hold, and the binary must build.
      # The errors are echoed as annotations and into the job summary, so a
      # failure is readable from the GitHub UI (and from `gh api`) without
      # downloading a log.
      - name: Unit tests (domain money/cart/VAT)
        shell: bash
        run: |
          set +e
          cargo test --all 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            {
              echo "## Erreurs de compilation"
              echo '```'
              grep -nE "^(error|warning: unused)" -A3 build.log | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Everything that matters, as annotations: compiler errors AND test
            # failures (a wrong number must be readable too, not just a red X).
            grep -nE "^(error|---- |test result:|thread )" build.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 build.log | while IFS= read -r line; do echo "::error::TAIL $line"; done
            exit 1
          fi

      - name: Build (release)
        run: cargo build --release

      # Advisory for now: style debt should not block a first build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Doctor smoke test
        run: cargo run -- --doctor

  # Advisory: the cloud half is a separate workspace and an optional service.
  # It must never paint the till's pipeline red — but its log stays readable in
  # the Actions tab, so a real breakage is still visible.
  control-plane:
    name: control-plane (${{ matrix.os }})
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/control -> target"
      # Separate workspace: checked but never blocks the till build.
      - name: Build control plane
        run: cargo build
        working-directory: crates/control

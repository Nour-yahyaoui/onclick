name: ci

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Blocking, and fast: catches the maud shorthand-class trap before the
      # compiler does (it broke the build twice, see issues #1 and #4).
      - name: maud class lint
        if: runner.os == 'Linux'
        run: python3 scripts/lint_maud.py

      # Blocking: the money maths must always hold, and the binary must build.
      # The errors are echoed as annotations and into the job summary, so a
      # failure is readable from the GitHub UI (and from `gh api`) without
      # downloading a log.
      - name: Unit tests (domain money/cart/VAT)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --all 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            cp build.log failed-build.log
            # GitHub keeps only 10 annotations per step: send the *real* errors,
            # one per line, never the whole log.
            # One annotation per error, with a few following lines glued in:
            # the bare "trait bound is not satisfied" never explains itself.
            awk '/^error(\[[A-Z0-9]+\])?:/ {ctx=NR+5} ctx>=NR {printf "%s | ", $0} /^error(\[[A-Z0-9]+\])?:/ {print ""}' build.log \
              | sed 's/\x1b\[[0-9;]*m//g' | head -6 > errors.txt || true
            if [ ! -s errors.txt ]; then
              grep -nE "test result: FAILED|panicked at|assertion .* failed|^---- " build.log \
                | head -6 > errors.txt || true
            fi
            if [ ! -s errors.txt ]; then tail -6 build.log > errors.txt; fi
            while IFS= read -r line; do echo "::error::$line"; done < errors.txt
            exit 1
          fi

      - name: Build (release)
        run: cargo build --release

      # Advisory for now: style debt should not block a first build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Doctor smoke test
        run: cargo run -- --doctor

  # Advisory: the cloud half is a separate workspace and an optional service.
  # It must never paint the till's pipeline red — but its log stays readable in
  # the Actions tab, so a real breakage is still visible.
  control-plane:
    name: control-plane (${{ matrix.os }})
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/control -> target"
      # Separate workspace: checked but never blocks the till build.
      - name: Build control plane
        run: cargo build
        working-directory: crates/control

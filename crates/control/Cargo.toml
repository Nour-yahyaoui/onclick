[package]
name = "control-plane"
version = "0.5.9"
edition = "2021"
description = "Cloud control plane: device pairing, leases, sync ingest, read-only dashboard."

# Standalone crate on purpose: `cargo build` at the repo root never builds it,
# so the till always compiles first. Run it with `cd crates/control && cargo run`.
[workspace]

[dependencies]
domain = { path = "../../crates/domain" }
anyhow = "1"
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
maud = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
sha2 = "0.10"
getrandom = "0.2"
chrono = { version = "0.4", features = ["clock"] }

[package]
name = "control-plane"
version = "1.0.10"
edition = "2021"
description = "Cloud control plane: device pairing, leases, sync ingest, read-only dashboard."

# Standalone crate on purpose: `cargo build` at the repo root never builds it,
# so the till always compiles first. Run it with `cd crates/control && cargo run`.
[workspace]

[dependencies]
domain = { path = "../../crates/domain" }
anyhow = "1"
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
maud = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `with-chrono-0_4` is NOT optional: `daily_agg.day` and `pairing_codes.expires_at`
# are DATE/TIMESTAMPTZ columns and the code reads/writes them as
# `chrono::NaiveDate`. Without this feature the crate does not compile at all
# ("the trait bound NaiveDate: FromSql is not satisfied").
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
sha2 = "0.10"
getrandom = "0.2"
chrono = { version = "0.4", features = ["clock"] }

[package]
name = "storage"
version = "0.5.6"
edition = "2021"
description = "SQLite (SQLCipher-ready) persistence, repositories, audit choke point."

[dependencies]
domain = { path = "../domain" }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"
uuid = { version = "1", features = ["v7", "v4"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
